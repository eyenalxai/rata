    id: d4f18534-74cc-4017-8e2c-9d92bc8aea9f
    title: "Stabilize the exit codes"
    description: |-
      ## Parent

      RATA-109 — Mission: mission-shaped front door for rata.

      ## What to build

      One stable exit code per error class. The classifier owns the map; every error site uses it. The JSON error object stays `{ code, message, hint }`. The README carries the table. Agents branch on the number, not the message.

      Mapping: 0 success, 1 internal, 2 validation, 3 not found, 4 conflict, 5 auth, 6 retryable.

      ## Acceptance criteria

      - [ ] A `--if-unchanged` conflict exits 4.
      - [ ] A missing issue exits 3.
      - [ ] A bad flag or malformed state exits 2.
      - [ ] A missing or invalid key exits 5; `forbidden` also exits 5.
      - [ ] A rate limit or network failure exits 6.
      - [ ] An unexpected failure exits 1.
      - [ ] The README table matches the code.
      - [ ] Each class has a test; no test parses a message.
