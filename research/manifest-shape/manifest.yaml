    id: fd6bee15-2d3e-47bb-9125-ebc886670f6a
    title: "Decide the graph-aware read"
    description: |-
      ## Question

      What does a graph-aware read look like in 0.9.0?

      Verification costs N+1 calls today. `issue show` reads one issue with its
      children and relations, but a map review needs the tree and its blocking edges.

      Decide:

      * Is it `issue list --include relations,children,comments`, a `rata graph <ref>`
        command, or both?
      * What does `graph` return: a flat list of nodes with parent ids, a nested tree,
        or nodes plus edges?
      * Is `--id-only` a global output flag, a graph flag, or a `--fields` shorthand?
      * Does `--count` exist, and does it read every page to answer?
      * What depth does a graph read take: one level, every level, or `--depth <n>`?
      * How many API calls and complexity points does one 40-ticket map cost, against
        the N+1 calls it replaces? The batch-facts ticket names the budget.
      * Does a graph read include trashed children, and does that wait on the trash
        surface?
