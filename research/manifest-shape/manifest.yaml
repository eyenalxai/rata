    id: 5b85d68b-730b-4030-ac6c-0b54b5640060
    title: "Add mission gate"
    description: |-
      ## Parent

      RATA-109 — Mission: mission-shaped front door for rata.

      ## What to build

      `rata mission gate <ref> <gate> --approve|--reject` turns a gate into data. It validates the transition, posts the evidence comment, then rewrites the state block. A repeated approval with the same evidence is `skipped`; different evidence is `conflict`. A rejection keeps the phase.

      The PR gate needs evidence. The URL must appear in a merged `github` attachment or in a comment. Every child ticket with a PR must have a merged PR.

      ## Acceptance criteria

      - [ ] Scope, Spec, Tickets, and PR advance the phase in order.
      - [ ] A skipped or out-of-order gate exits 4 and writes nothing.
      - [ ] A rejection keeps the phase and records the reason.
      - [ ] The PR gate refuses without evidence, without a merge, or with an open child PR.
      - [ ] The comment is posted before the state write and a retry is safe.
      - [ ] `--dry-run` prints the transition and the comment.
      - [ ] The state write uses `--if-unchanged`.
