        body: |-
          ## Finding

          Dates are plain input fields, not an import-job privilege. `IssueCreateInput.createdAt` and `completedAt` accept a past time and name no auth mode; Linear's own `@linear/import` CLI passes them on a personal API key (`packages/import/src/importIssues.ts:54`, `:364-365`). `IssueUpdateInput` has neither field, so backdating is **create-only**; a wrong date needs delete and recreate. Comment `createdAt` is worded identically and is unproven at runtime.

          - A comment author cannot be kept with an API key: `createAsUser` is OAuth `actor=app` only. Best substitute is a bold prefix line inside a real comment (`**Ada Lovelace** · 2019-04-03`), which keeps threading, counts and per-comment dates. Folding into the description, as Linear's CLI does, loses all three.
          - `issueImportCreateCSVJira` is Jira-columns-only. There is no generic mapping and no `IssueImportMappingInput`. It is the one importer without `instantProcess`, so it stops before processing and needs `issueImportProcess` with an undocumented `mapping` JSON. rata could host the CSV via `importFileUpload` → signed PUT → `assetUrl`, but identifiers survive only into a new or empty team, and no query returns `IssueImport` to poll progress.
          - Cost: an import job is ~5 calls; API writes are one request per entity against 2,500/hour. The import job also allows bulk deletion within 7 days.
          - Recommendation: **rata manifest plus batched writes** as the main path; keep Linear's import job for an identifier-preserving load into a fresh team.

