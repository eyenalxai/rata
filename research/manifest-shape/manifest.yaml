  - key: RATA-94
    id: 47f3a842-0e5d-4513-a194-fa9bf179e5bc
    title: "Establish Linear's issue trash and restore semantics"
    description: |-
      ## Question

      What does Linear expose for issue trash and restore?

      The destination names `issue delete`, `issue restore`, `issue trash list` and a
      `trashed` field on reads. Charting found `issueDelete`, `issueArchive(trash)`,
      `issueUnarchive` and `Issue.trashed`. Confirm the semantics.

      Answer from the schema and the SDK:

      * `issueDelete` trashes an issue. Is the 30-day grace period documented? Is
        `permanentlyDelete` admin only?
      * Is `issueUnarchive` the inverse of `issueDelete` for an issue, the way
        `projectUnarchive` is for a project? Or does an issue need a different call?
      * What does `issueArchive(trash: true)` do that `issueDelete` does not? Are
        archived and trashed the same state?
      * Is `trashed` selected on the normal `issue` and `issues` queries? Is it null
        on a live issue?
      * Can the `issues` filter select trashed issues? Does `includeArchived` return
        both archived and trashed, and can a caller tell them apart?
      * Does `issueUnarchive` restore an archived issue that was never trashed?
        Does that matter for the CLI surface?
      * Do trashed issues keep children, relations, comments and attachments? What
        happens to a child when its parent is trashed?
      * Can a caller restore an issue by identifier, or only by id?

      Leave the findings on a `research/issue-trash` branch with a context pointer
      comment here. Open no PR.
    state: Done
    priority: high
    labels: ["wayfinder:research"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:17.266Z"
    comments:
      - key: finding
        id: dc53319b-6d2c-4c73-b410-060a8e0cb7fa
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T15:50:11.554Z"
        body: |-
          ## Finding

          Trash is a flag on an archived issue, not a separate state. `issueDelete` trashes and takes `permanentlyDelete`, which skips the documented 30-day grace and is "Available only to admins!" (`schema.graphql:26590-26602`). `issueArchive(trash: true)` reaches the same state by the other entry point and returns the same `IssueArchivePayload`. `issueUnarchive` is the only issue restore mutation; `issueUpdate` with `trashed: null` is the documented fallback.

          - `Issue.trashed` is a nullable `Boolean` on the normal `issue` and `issues` queries. A read-only probe of 250 live issues returned `null` 249 times and `false` never.
          - `IssueFilter` has no `trashed` field. `includeArchived: true` is the only switch, and it returns archived **and** trashed issues together; the `trashed` field separates them.
          - `issue(id:)` resolves a trashed issue by identifier and by UUID, with no `includeArchived` argument.
          - A trashed parent hides its children from the default read; they return only with `children(includeArchived: true)`.
          - Comments, attachments, and subtree restore are unverified.

          CLI consequence: `issue list --trashed` needs `includeArchived: true` plus a client-side `trashed` filter, not a server filter. The `--include-archived` fallback is therefore not equivalent, and `--trashed` is the honest name.

          Full finding: [research/issue-trash.md](https://github.com/eyenalxai/rata/blob/research/issue-trash/research/issue-trash.md) on the `research/issue-trash` branch. No PR.
