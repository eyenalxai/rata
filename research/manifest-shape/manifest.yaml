  - key: RATA-93
    id: 9fb669b9-2a68-480a-94a2-4fb7aec3161a
    title: "Establish Linear's migration provenance and import-job facts"
    description: |-
      ## Question

      Which provenance can rata keep in a migration, and does Linear's own import job
      beat rata's writes?

      The destination names import, export and provenance. The harbagsa migration lost
      issue dates and comment authors. Charting found that the API accepts some
      provenance fields. Confirm which ones a normal API key accepts.

      Answer from the schema and the SDK:

      * `IssueCreateInput.createdAt` and `completedAt` accept a past time "if
        importing from another system". Does a plain API key accept them, or only an
        import job?
      * `CommentCreateInput.createdAt` accepts a past time. Same question.
      * `createAsUser` and `displayIconUrl` say "only available to OAuth applications
        creating issues in `actor=app` mode". Can rata with an API key keep a comment
        author? If not, what is the best substitute: a footer marker, a prefix, or
        nothing?
      * `issueImportCreateCSVJira(csvUrl, jiraEmail, jiraHostname, jiraToken, teamId)`
        exists, with `issueImportCheckCSV`, `issueImportUpdate`, `issueImportDelete`,
        `issueImportCreateGithub`, `issueImportCreateJira` and
        `issueImportCreateClubhouse`. What column set does the CSV import accept: Jira
        columns only, or a generic mapping? Which fields does the mapping cover:
        state, labels, assignee, parent, relations, comments, `createdAt`?
      * Does an import job keep the issue identifiers? Does it report progress? Can it
        target an existing team by id?
      * Can rata drive an import end to end, or does it need a `csvUrl` that Linear
        can reach over the network?

      Close with a recommendation: rata manifest plus batch writes, Linear's import
      job, or both. Give the reason in two lines. Leave the findings on a
      `research/migration-provenance` branch with a context pointer comment here. Open
      no PR.
