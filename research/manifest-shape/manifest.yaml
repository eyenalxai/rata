    title: "Guard the body write"
    description: |-
      ## Parent

      RATA-109 — Mission: mission-shaped front door for rata.

      ## What to build

      A whole-body write cannot delete a section by accident. The update compares the heading set (level plus text) before and after. Additions pass. A missing heading or a level change fails unless `--replace-body` is passed. `--require-sections` checks the result. `--dry-run` prints a real diff for a replace, not only for an append.

      ## Acceptance criteria

      - [ ] A dropped heading, a renamed heading, and a level change each exit 2 and list the lost headings.
      - [ ] An added heading passes.
      - [ ] `--append` is exempt; `--replace-body` bypasses the guard.
      - [ ] `--require-sections` fails when a named heading is missing.
      - [ ] `--dry-run` prints the unified diff for a replace.
      - [ ] The existing section edits keep their behavior.
