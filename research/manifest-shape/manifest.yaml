  - key: RATA-109
    id: 81bb8258-cc00-42c0-8c48-908a4c4f912a
    title: "Mission: mission-shaped front door for rata"
    description: |-
      # Mission: mission-shaped front door for rata

      ## Destination

      One command surface that treats a mission as structured state plus append-only
      history: `mission init|status|gate|handoff|next`, a guarded body write, a
      stamped handoff log, `issue status`, `doctor`, and bare-number references. A
      session reads state with one `mission status` call and writes a gate with one
      `mission gate` call.

      ## Problem

      The current loop hand-assembles the mission table and retypes dates; the skill
      then trusts prose. A whole-body replace can drop a section. `issue show` returns
      attachments but not PR state, checks or the merge commit. `mission` and `doctor`
      do not exist. `--all` shipped in 0.8.0; bare numbers, `--ids-only` and a
      documented exit-code contract did not.

      ## Constraints

      * Linear has no custom issue fields. The mission document is an issue.
      * This repository does not use Linear projects as a container.
      * Linear has no compare-and-swap; `--if-unchanged` stays best effort.
      * A `github` attachment carries status, draft, reviews, conflicts, mergedAt and
        closedAt. It carries no checks and no merge-commit SHA.
      * Linear exposes integration service names, not magic-word mappings.
      * No GitHub client, no token and no `gh` shell-out.
      * No backwards compatibility with 0.8.0.

      ## Approach

      * Mission state is a fenced `json` block inside the `## Mission` section. Only
        `mission` commands write it. Stable prose lives outside it.
      * History is comments with `--dedupe-key`. Gate evidence is posted before the
        state transition, so a retry is safe.
      * `mission init` creates the block and the stable sections.
      * `mission status` prints the one-line contract; `--json` prints the object.
      * `mission gate` validates a legal transition.
      * `mission handoff` appends the stamped comment.
      * `mission next` prints the exact next command.
      * `issue update --body-file` refuses a dropped or renamed heading unless
        `--replace-body` is passed. `--require-sections` adds a required set.
      * `issue status` merges Linear state, blockers, the next child and the `github`
        attachment projection.
      * `section append --stamp` writes date, session, phase, gate and method in the
        link timezone.
      * `doctor` is a read-only preflight.
      * Bare `48` resolves through the linked team key. `--ids-only` prints
        identifiers.

      ## Mission

      Status: active
      Scope: feature
      Phase: implement
      Gate: PR, pending
      Goal: a mission-shaped CLI front door that replaces the hand-assembled document.
      Exit: the spec's tickets merged, `code-review` passed, 0.9.0 released.

      ## Flow

      - [X] classify: fog, then feature after the grill
      - [X] grill: nine decisions settled
      - [X] scope gate: approved by the owner (2026-10-29)
      - [X] spec: approved by the owner (2026-10-29)
      - [X] tickets: 12 children with edges (2026-10-29)
      - [ ] implement, one PR per ticket
      - [ ] code-review each PR
      - [ ] release 0.9.0

      ## Gates

      | Gate | Method | Document | Status |
      | -- | -- | -- | -- |
      | Scope and understanding | grill | this issue | approved by the owner, 2026-10-29 |
      | Spec | owner review | this issue, `## Spec` | approved by the owner, 2026-10-29 |
      | Tickets | owner review | children of this issue | approved by the owner, 2026-10-29 |
      | PR | `code-review` | one PR per ticket | pending |

      ## Session plan

      | Session | Work | Exit |
      | -- | -- | -- |
      | 1 | classify, grill, record the mission | scope gate approval |
      | 2 | write the spec | spec gate approval |
      | 3 | cut the tickets | ticket gate approval |
      | 4..n | one ticket per session, review, PR | one merged PR per ticket |
      | n+1 | release 0.9.0 | tag and Arch package |

      ## References

      | Reference | Why | Path or URL | Phase |
      | -- | -- | -- | -- |
      | RATA-83 | the 0.9.0 bulk and import map | [RATA-83](https://linear.app/utbetdix/issue/RATA-83) | classify |
      | RATA-91 | command surface and `--id-only` | [RATA-91](https://linear.app/utbetdix/issue/RATA-91) | spec |
      | RATA-95 | PR awareness finding | [RATA-95](https://linear.app/utbetdix/issue/RATA-95) | spec |
      | RATA-104 | machine-first output and exit codes | [RATA-104](https://linear.app/utbetdix/issue/RATA-104) | spec |
      | RATA-105 | PR awareness surface | [RATA-105](https://linear.app/utbetdix/issue/RATA-105) | spec |
      | ADR-0008 | body edits are heading-based | docs/adr/0008-body-edits-are-heading-based-and-best-effort.md | spec |
      | issue-tracker doc | tracker conventions | docs/agents/issue-tracker.md | implement |
      | rata skill | the CLI skill | skills/rata | implement |
      | mission skill | the global mission skill | \~/.agents/skills/mission | implement |

      ## Decisions

      * A new mission, related to RATA-83. RATA-83 keeps bulk import/export, apply, graph reads, machine output and PR awareness; it retargets to 0.10.0.
      * Mission state is a fenced `json` block in `## Mission`; history is comments. Supersedes ADR-0008 with a new ADR.
      * Command surface: `mission init|status|gate|handoff|next`.
      * `issue status` reads Linear only; checks and merge SHA are null.
      * The body write refuses section loss without `--replace-body`; no TTY dry-run.
      * `doctor` is read-only; it does not discover magic words.
      * Bare numbers resolve through the linked team. `--ids-only` supersedes `--id-only`.
      * Stamp: `date, session, phase, gate, method` on one line. The date comes from the link timezone; phase, gate, method and session come from the mission block. `--session` overrides; `mission handoff` increments the session. On an issue with no mission state, all four flags are required.
      * Scope moved from fog to feature after the grill: the mission-state representation was the only key fork.
      * Release: 0.9.0 is the front door. The front door owns the core exit codes and the Linear-only PR projection. RATA-83 retargets to 0.10.0; RATA-104 and RATA-105 own the batch and graph extensions.

      ## Outputs

      * spec: this issue, `## Spec`
      * tickets: RATA-110 to RATA-121 (12 children)
      * graph:
        * RATA-110 docs: no blockers
        * RATA-111 exit codes: no blockers
        * RATA-112 issue status: blocked by RATA-111
        * RATA-113 mission init: blocked by RATA-111
        * RATA-114 mission status/next: blocked by RATA-112, RATA-113
        * RATA-115 mission gate: blocked by RATA-111, RATA-112, RATA-113
        * RATA-116 mission handoff/stamp: blocked by RATA-111, RATA-113
        * RATA-117 body guard: blocked by RATA-111
        * RATA-118 doctor: blocked by RATA-111, RATA-112
        * RATA-119 refs/ids: blocked by RATA-111
        * RATA-120 docs: blocked by RATA-110, RATA-113 to RATA-119
        * RATA-121 release: blocked by RATA-120
      * PRs:
        * RATA-110 docs: [https://github.com/eyenalxai/rata/pull/23](<https://github.com/eyenalxai/rata/pull/23>), open, awaiting review and merge
      * release: 0.9.0

      ## Next step

      * Skill: `implement`
      * Gate: PR
      * Method: `code-review`
      * Command: review and merge [https://github.com/eyenalxai/rata/pull/23](<https://github.com/eyenalxai/rata/pull/23>), then implement RATA-111
      * Produce: one merged PR, then one PR for RATA-111

      ## Handoff log

      * 2026-10-29T21:31:04+04:00 — session 3, phase tickets, gate Tickets approved, method owner review, prompt delivered in chat.
      * 2026-10-29T21:46:18+04:00 — session 4, phase implement, gate PR pending, method code-review, prompt delivered in chat.

      ## Spec

      ### Problem Statement

      An agent that runs a mission hand-assembles the mission table, retypes dates, and trusts prose. The mission body has no typed state. A whole-body write can drop a section. A session needs several commands to learn the issue state, the PR state, the blockers, and the next child. There is no preflight for auth, link, team access, and the GitHub integration. All errors exit `1`, so a script cannot tell a conflict from a validation error. A bare issue number does not resolve.

      ### Solution

      A `mission` command group treats the mission document as typed state plus append-only history. `mission init` writes the state. `mission status` reads it and prints the contract. `mission gate` validates a transition and records evidence. `mission handoff` appends a stamped comment. `mission next` prints the next command. A guarded body write refuses to drop a section. `issue status` merges the issue, its PRs, its blockers, and its next child. `doctor` checks the setup. Bare numbers resolve through the linked team. `--ids-only` prints identifiers. The core exit codes become stable.

      ### User Stories

       1. As an agent starting a session, I want one `rata mission status <ref>` call, so that I know the phase, gate, method, next step, stale references, and linked PRs.
       2. As an agent, I want `rata mission next <ref>` to print the exact next command, so that I do not infer it from prose.
       3. As an agent, I want `rata mission gate <ref> Spec --approve --evidence <url>`, so that a gate is data with a legal transition, not a table cell.
       4. As an agent, I want an illegal transition to fail with a distinct exit code, so that I branch on the code and not on the message.
       5. As an agent, I want the PR gate to refuse approval without a merged PR or a review comment, so that prose cannot approve a gate.
       6. As a mission owner, I want `mission handoff` to append one stamped line in the link timezone, so that I stop retyping dates.
       7. As a mission owner, I want the handoff log to be comments, so that a body rewrite cannot drop a row.
       8. As an agent, I want `issue update --body-file` to refuse a dropped or renamed section, so that I cannot delete a mission section by accident.
       9. As an agent, I want `--replace-body` when a rewrite is intentional, so that the guard has a clear escape hatch.
      10. As a mission owner, I want `--require-sections Phase,Gate,Next step`, so that a mission document keeps its shape.
      11. As an agent, I want `--dry-run` to print a real unified diff for every body write, so that I review the change before the write.
      12. As an agent, I want `rata issue status <ref>` to return the state, the PR, the blockers, and the next unblocked child, so that I do not call `gh` and `issue show` separately.
      13. As an agent, I want the PR projection to come from the Linear attachment, so that I need no GitHub token.
      14. As a mission owner, I want `mission status --verify` to check every ticket's PR, so that "done" is not an assumption.
      15. As an operator, I want `rata doctor` to check auth, link, team access, the GitHub integration, and the timezone, so that I see a broken setup before a mission starts.
      16. As an operator, I want `doctor` to name the closing words and the completed state, so that the merge automation is explicit.
      17. As an agent, I want `48` to resolve to the linked team's issue, so that I type less and make fewer mistakes.
      18. As an agent, I want `--ids-only` on list reads, so that I can pipe identifiers into the next command.
      19. As an agent, I want stable exit codes, so that a script branches on the code.
      20. As a maintainer, I want the docs, the CLI help, and the skill to teach the safe door, so that agents use `section replace` and `--dry-run`.

      ### Implementation Decisions

      #### Command surface

      * `rata mission init <ref> [--scope] [--phase] [--gate] [--method] [--session] [--dry-run]` creates the `## Mission` state block and the missing stable sections. An existing block returns `skipped`; `--reset` rewrites it.
      * `rata mission status <ref> [--json] [--fields] [--verify]` reads the block, the two tables, the issue, the PRs, the blockers, and the next child. The human output is the one-line contract. `--json` is the full object. `--verify` reads each child's `github` attachments.
      * `rata mission gate <ref> <gate> --approve|--reject [--evidence <url>] [--reason <text>] [--dry-run]` validates the transition, posts the evidence comment first, then rewrites the state block. A repeated approval with the same evidence returns `skipped`; a different evidence returns `conflict`.
      * `rata mission handoff <ref> [--session <n>] [--dry-run]` appends one stamped comment and increments the session in the state block. It prints the line. It does not print the prompt.
      * `rata mission next <ref>` prints the `Next step:` line only. It is read-only.
      * `rata issue status <ref> [--json] [--fields]` is the generic read. It returns the issue header, `blocked`, `blockedBy`, `nextChild`, and `prs`.
      * `rata doctor [--json]` runs the checks and prints a table. It is read-only.
      * `mission` is a top-level group. `issue status` is an `issue` subcommand. `mission next` does not collide with `rata next`.

      #### Mission state

      The `## Mission` section holds a short generated summary and one fenced `json` block. The block is the source of truth. The summary is rewritten with the block, so it cannot drift.

      ```json
      {
        "schema": 1,
        "status": "active",
        "scope": "feature",
        "phase": "spec",
        "gate": {
          "name": "Spec",
          "status": "pending",
          "method": "owner review"
        },
        "goal": "a mission-shaped CLI front door",
        "exit": "the tickets merged, 0.9.0 released",
        "session": 1,
        "next": {
          "skill": "to-spec",
          "gate": "Spec",
          "command": "approve the spec",
          "produce": "the tickets"
        },
        "gates": [
          {
            "name": "Scope and understanding",
            "status": "approved",
            "method": "grill",
            "evidence": "https://linear.app/...",
            "approvedAt": "2026-10-29T17:21:45.954Z"
          }
        ]
      }
      ```

      * `phase` is `classify`, `grill`, `spec`, `tickets`, `implement`, or `done`.
      * `scope` is `fog`, `feature`, `change`, `bug`, or `trivial`.
      * `gates` is the ordered list of the four gates.
      * The block does not duplicate the session plan or the references. The `## Session plan` and `## References` tables stay canonical. `mission status` parses both tables and reports a malformed row as `validation`. `mission init` creates the tables with their headers when they are missing.
      * A local path in the `## References` table is checked for existence; a URL is `unchecked`.
      * A missing or malformed block is `not_found` or `validation`. A newer `schema` is `validation`.
      * Legacy mission documents are not parsed. `mission init` adds the block and the tables; the prose stays.

      #### Legal transitions

      * Scope gate: phase `grill` -> approved -> phase `spec`.
      * Spec gate: phase `spec` with the scope gate approved -> approved -> phase `tickets`.
      * Tickets gate: phase `tickets` with the spec gate approved -> approved -> phase `implement`.
      * PR gate: phase `implement` with the tickets gate approved -> approved -> phase `done`.
      * A rejection sets the gate to `rejected` and keeps the phase. A later approval with new evidence is allowed.
      * The PR gate needs `--evidence`. The URL must appear in a `github` attachment with `status: "merged"`, or in a comment on the issue or a child. Every child ticket with a PR must have a merged PR.
      * Other gates accept evidence but do not require it.
      * The state write uses `--if-unchanged` internally. If the issue changed, the command returns `conflict` and writes no state.

      #### Exit codes

      | Code | Meaning |
      | -- | -- |
      | `0` | Success, including a skipped idempotent write. |
      | `1` | Internal error. |
      | `2` | Validation: bad input, missing flag, malformed state, missing section, ambiguous heading, missing link. |
      | `3` | Not found: issue, gate, section, or PR. |
      | `4` | Conflict: stale `updatedAt`, illegal transition, an approved gate with different evidence. |
      | `5` | Auth: missing or invalid key, forbidden. |
      | `6` | Retryable: rate limit or network. |

      The JSON error object keeps `code`, `message`, and `hint`; the exit code is the number. The README carries the table. A `--if-unchanged` conflict exits `4`.

      #### Guarded body write

      * `issue update --body-file` and `--body` compare the heading set (level plus text) of the old and new body. Additions are allowed. A missing heading or a level change is refused unless `--replace-body` is passed. The error is `validation` and lists the lost headings.
      * `--append` is exempt. `--replace-body` bypasses the guard.
      * `--require-sections A,B` checks the resulting body for the exact headings. A missing heading is `validation`.
      * `--dry-run` prints a unified diff for every body change, including a whole-body replace. The plan computes the diff for the replace path as well as the append path.

      #### Stamp

      `section append <ref> <heading> --stamp` appends one line:

      ```text
      - 2026-10-29T21:14:00+03:00 — session 2, phase implement, gate PR, method code-review
      ```

      * The date uses the linked team's timezone. The phase, gate, method, and session come from the mission block. `--session` overrides.
      * Without a mission block, all four flags are required.
      * `mission handoff` uses the same formatter and writes a comment, not a body section.
      * A missing link is `validation` with a hint to run `rata link`.

      #### `issue status`

      * One command, several reads. It reuses the issue read, the relation projection, and the child list.
      * The PR projection reads `sourceType: "github"` attachments and `metadata`: `status`, `draft`, `reviews`, `hasConflicts`, `mergedAt`, `closedAt`, `number`, and `repo`. `checks` and `mergeCommit` are `null`. Each PR carries `source: "linear"`.
      * `blockedBy` is one level. `blocked` is true when any blocker is open.
      * `nextChild` is the first open, unblocked child ordered by priority and then `createdAt`. It does not filter on assignee. `rata next` keeps its unassigned filter for the wayfinder claim.
      * A missing attachment is `prs: []`, not an error. A missing `metadata` gives `null` fields, not an error.

      #### `doctor`

      * Checks: `auth` (key and viewer), `link` (repository link and team key), `team` (team read with states, labels, and members), `github` (the organization's integrations include `github`), `pr-attachment` (one `github` attachment has the expected keys, when one exists), and `timezone` (the team timezone is set and valid).
      * The closing words are fixed: `Fixes`, `Closes`, and `Resolves` plus the identifier. `doctor` prints them with the team's first completed state. It does not discover a mapping.
      * Exit `0` for ok or warn. Exit `5` for an auth failure. Exit `2` for a link or team failure. A warning does not fail the command.

      #### Refs and identifiers

      * A bare number `48` expands to `<team key>-48` when the command has a team context: the repository link or a `--team` flag. Without a team, the command fails `validation` with a hint to run `rata link`.
      * Full identifiers, UUIDs, and URLs do not change.
      * `--ids-only` is a list flag on `issue list` and `search`. It prints one identifier per line and composes with `--all`. It is not valid with `--json` or `--fields`; use `--json --fields identifier` for JSON.
      * The name is `--ids-only`, not `--id-only`. This supersedes RATA-91's name.

      #### Docs and skills

      * The README gains the command reference, the exit-code table, the mission section, the guard, and the stamp.
      * The issue tracker doc gains the mission commands, the safe body write, the comment history, and the bare refs.
      * The rata skill gains the same surface, with examples.
      * The glossary gains the mission terms.
      * A new ADR records that mission state is typed and history is append-only. ADR-0008's parser rules stay; its mission framing is superseded.
      * The global mission skill changes in the owner's home directory: `mission handoff` writes the log, and the body keeps stable prose only. This change is not in the repository.

      #### Release

      Version `0.9.0` in `package.json` and the CLI. The Arch package, the tag, and the skill update follow the release checklist.

      ### Testing Decisions

      * Test external behavior, not implementation details. Use the existing CLI harness with a fake Linear handler. The highest seam is `runRoot` for the commands and pure functions for the state machine.
      * Pure tests: the state codec (round trip, missing keys, unknown keys, schema version), the transition table (every legal and illegal pair, idempotency, rejection), the heading-set guard (drop, rename, level change, addition, `--replace-body`), the stamp formatter (a fixed zone, a DST date, a missing link), the bare-number expansion (linked, unlinked, full refs), the exit-code map, the PR projection (full metadata, missing metadata, no attachment), and the table parsers (a valid table, a malformed row, a missing table).
      * CLI tests through `runRoot` and the fake handler: `mission status` human and JSON, `mission gate` approve, reject, conflict, illegal, `mission handoff` comment and session, `mission next`, `issue status` JSON, `doctor` ok, warn, fail, `--ids-only`, `--require-sections`, and `--replace-body`.
      * Prior art: the frontier tests for read commands, the section and update-body tests for body writes, the comment dedupe tests for idempotency, the status test for a standalone command, and the section parser tests.
      * Do not test wiring, pass-through, or the exact prose.

      ### Out of Scope

      * Live GitHub checks, the merge-commit SHA, a GitHub token, or a `gh` shell-out.
      * Automatic migration of legacy mission documents.
      * A Linear project or project document as the state store.
      * Local SQLite as the mission source of truth.
      * A TTY default for `--dry-run`.
      * `mission done` as a command; `mission status --verify` is the check, and the skill closes the issue.
      * Bulk import and export, declarative apply, graph reads, cache, and audit (RATA-83, 0.10.0).
      * `--format`, a template language, and JSONL.
      * Comment reactions, resolve, and attachments as a surface.
      * A UI or TUI.

      ### Further Notes

      * The mission state block is a fenced `json` block inside `## Mission`. The section parser ignores fences, so the block does not split the section.
      * The evidence comment is written before the state transition. A failed state write leaves a harmless comment and a safe retry.
      * `mission status --verify` reads one attachment page per child. It is opt-in because it costs N reads.
      * The PR gate is procedural. The command verifies that the evidence exists, not that a human reviewed the diff.
      * The first dogfood is this mission: run `mission init` on RATA-109 after the first ticket lands, then use `mission status` and `mission gate` for the rest of the mission.
      * The seam is one: `runRoot` with the fake Linear handler, plus the pure mission state module. No new seam is needed.
