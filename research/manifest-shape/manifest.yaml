        the integration for them to appear?
      * If rata reads GitHub directly: which auth is available (`gh` CLI, a token in
        the repository config, a token in the local database, none), which host
        (GitHub only, or also GitLab and others), and how many requests does one issue
        cost?
      * What maps an issue to its PR: the Linear attachment, `Fixes RATA-42` in the PR
        body, the branch name, or the identifier in the title? Which of those is
        reliable across the rata workflow?
      * Does Linear's GitHub integration already report the PR for a branch that
        references the identifier? Check the attachment behaviour in the SDK docs.

