  - key: RATA-96
    id: 03e8b900-97af-4143-a112-a70548d18bc2
    title: "Decide the identity and idempotency contract"
    description: |-
      ## Question

      What is the identity and idempotency contract for 0.9.0?

      A retried import must not duplicate a write. `IssueCreateInput.id` lets the
      client choose the issue id. That would make create idempotent, and it would let
      one batch wire parents, children and blockers without a read.

      Decide:

      * Does rata derive the issue id from a caller key (a UUIDv5 of the team and the
        key), does it store the key-to-id mapping in the local SQLite database, or
        does it write a footer marker in the body?
      * Is the surface `issue create --key <key>`, a new `issue upsert --key <key>`, or
        both?
      * What does a retry return: the existing issue with `skipped`, the existing
        issue with `updated`, or an error?
      * Does `--key` update an existing issue when the incoming body differs, or only
        create and skip?
      * What happens when the key exists on another team, or when the derived id
        collides with an issue rata did not create?
      * Does the manifest carry the key, so a re-import reconciles instead of
        duplicating?
      * Does a failed write leave a half-written object, and does the key make the
        retry safe?

      Keep the answer to one paragraph plus the flag table. This decides the flags in
      the import and apply tickets.
    state: Done
    priority: high
    labels: ["wayfinder:grilling"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:27.138Z"
    comments:
      - key: resolution
        id: 06133e35-84df-41e7-9cd5-385ef3683289
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T17:01:44.548Z"
        body: |-
          ## Resolution

          The owner approved all seven recommendations on 2026-10-29. This comment is the
          identity and idempotency contract for 0.9.0.

          `issue create --key` derives the issue id from the team and the key, and the id
          is the identity. The id is `sha256("issue\0" + teamId + "\0" + key)` with the
          version and variant nibbles forced to UUIDv4, because `IssueCreateInput.id`
          accepts only UUIDv4 and a UUIDv5 fails that rule. The key is a non-empty UTF-8
          string of 1–255 bytes, hashed as exact bytes with no trim or case fold. There is
          no key-to-id map in SQLite and no footer marker: a map dies with the local
          database, and a footer cannot be the identity. The team UUID is in the preimage,
          so the key is team-scoped; the same key on another team is another issue. The
          command reads `issue(id)` before it writes. A hit in the target team returns the
          existing issue as `skipped`, including a trashed one; a hit in another team
          returns `conflict` and never adopts the issue; a failed create re-reads the id,
          and a hit returns `skipped`, a miss the original failure. `--key` is create-only:
          it never updates a title, body, label, parent or state, and a changed manifest is
          `rata apply`'s work (RATA-102). A manifest entry carries `key` to create and `id`
          to address an existing issue; `apply` prefers `id`, `export` writes `id`, and
          `import` requires `key`. The key covers the issue only. Comments keep
          `--dedupe-key`, `issue link` keeps its read-then-skip check, and `apply` reports
          per-entry failure. Every create result gains `status: "created" | "skipped"` and
          echoes `key`; a skipped result has `visible: null`, and `--dry-run` reports the
          same status without a write.

          ### Flag table

          | Flag | Command or file | Contract |
          | -- | -- | -- |
          | `--key <key>` | `issue create` | Derives the UUIDv4-shaped id. A hit returns `skipped`; a miss creates. Create-only, never updates. |
          | `key` | manifest entry (`rata apply`, `rata import`) | The creation identity. Required by `import`; `apply` derives the id when `id` is absent. |
          | `id` | manifest entry (`rata apply`) | The Linear UUID of an existing issue. `apply` prefers it over `key`; `rata export` writes it. |
          | `--dedupe-key <key>` | `issue comment create` | Unchanged. Comments keep their own issue-scoped key (ADR-0007). |
          | no new flag | `issue link` | Unchanged. It reads the relations first and reports `skipped`. |

          ### Inherited by

          - RATA-97 owns the batch report and the partial-failure shape. The issue key does
            not cover comments or relations.
          - RATA-98 owns whether `issue(id)` returns a trashed issue. The contract treats a
            visible trashed hit as `skipped`.
          - RATA-101 owns the import file fields; RATA-102 owns `apply` convergence and the
            `updated` result.
          - An ADR is warranted for the derived id and the rejected local map. It lands with
            the 0.9.0 spec, not as a separate PR.
    blocks: [RATA-100]

  - key: RATA-97
    id: e06c6979-b939-462c-9fe3-d33da5d7360d
    title: "Decide the batch execution and progress contract"
    description: |-
      ## Question

      What is the batch execution and progress contract?

      One `rata import` run must replace 578 subprocesses with one process and a few
      API calls. A 25-minute migration must become a bounded, resumable run.

      Decide:

      * One process, one connection, sequential batches, or bounded concurrency? What
        is the default, and is there a `--concurrency` flag at all?
      * Which chunk size: the backend maximum, 50 like `issueBatchUpdate`, a fixed
        number, or a flag?
      * How does rata back off on a 429: sleep to `reset`, exponential with jitter, or
        both? Does the run resume, or fail?
      * What is the progress output: one line per batch on stderr, a JSONL stream on
        stdout, nothing without `--verbose`, or a progress line that redraws?
      * Does a failed batch stop the run, continue and report per item, or retry once?
      * Does the run write resumable state, and who owns the file: rata, or the caller
        with `--state <file>`?
      * How does a batch run report one result per item, as the bulk write contract in
        `GLOSSARY.md` requires (`updated`, `skipped`, `failed`)?
    state: Done
    priority: high
    labels: ["wayfinder:grilling"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:28.621Z"
    comments:
      - key: resolution
        id: a4ea1566-f0e1-4b0f-b606-e67b101ec6d0
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T17:13:25.915Z"
        body: |-
          ## Resolution

          The owner approved all nine recommendations on 2026-10-29. This comment is the
          batch execution and progress contract for 0.9.0.

          ### The shape of the run

          One `import` or `apply` invocation is one process, one HTTP client, and
          sequential requests. 0.9.0 adds no `--concurrency` flag. Results are collected
          by input index, so a bounded window later is an internal change, not a surface
          change. RATA-108 may reopen this default with measured numbers.

          The 578-item migration is 281 write requests plus reads:

          - 304 creates become 7 `issueBatchCreate` calls at 50 per call.
          - 194 comments and 80 links stay one request each. Linear has no batch mutation
            for either.
          - Complexity is about 600 to 900 points of the 3,000,000 hourly budget. The
            constraint is request count and latency, not complexity.

          The 25 minutes came from spawning a process per write. Sequential in-process
          requests at 0.3 to 1 second each run the same work in about 1.5 to 4 minutes.

          ### Chunk size

          The chunk is 50, fixed, from one constant that names the documented cap of
          `issueBatchCreate` and `issueBatchUpdate`. There is no `--batch-size` flag. A
          smaller value costs requests and buys nothing; a larger value is rejected.

          `issueBatchUpdate` is not used in 0.9.0. It applies one input to every id, and
          `apply` changes fields per entry. Per-issue updates stay the general path until
          a uniform-change case is measured.

          ### Order

          Creates are ordered level by level: parents before children, one batch per
          level. A child never names a parent created in the same batch, because that rule
          is unverified. RATA-108 settles it with evidence. If it holds, a later version
          can fold a tree into one batch without changing the report.

          ### Rate limits

          A 429 honours `Retry-After` when it is at most 60 seconds. Otherwise the client
          uses exponential backoff with jitter, from a 200 ms base. Each request gets 3
          attempts.

          A 429 that survives the attempts means every later request fails too. The run
          stops, reports `rate_limited` with `retryAfterSeconds`, exits 1, and leaves the
          rest unattempted. A rerun resumes through the identity contract. Retries are
          safe because every create carries a write key and every comment a dedupe key.

          ### A failed batch

          `issueBatchCreate` is atomic, so a failed chunk writes nothing. On failure rata
          reads the chunk's ids once:

          - A hit is `skipped`. A timeout may have committed the chunk.
          - A miss is retried once.
          - A second failure marks every miss `failed` with the batch error and stops the
            run, because later chunks depend on them.

          Comments, links and other one-per-request writes record `failed` per item and
          continue, as the existing bulk write does. The run exits 1 at the end.

          A batch response is matched by id, never by index.

          ### Resumable state

          `--state <file>` is optional and caller-owned. Rata writes it and never reads
          it. It is a JSONL audit: one line per attempted item with `key`, `id`,
          `identifier` when known, `status`, and `error` when failed. Each line is flushed
          as it is written, so a killed run leaves a valid prefix.

          Resume is a rerun of the same command. The manifest and Linear are the state,
          because creates, comments and links are idempotent. A local skip list would be
          the map RATA-96 rejected, and it could skip an issue Linear lost. Without
          `--state`, the run writes nothing locally. `--dry-run` writes no state file.

          ### Progress

          Progress goes to stderr, never stdout:

          - One line per completed 50-item chunk, with the phase name. For example
            `created 50 of 304 issues`.
          - One summary line at the end with the counts, or the stop reason.
          - No redraw and no carriage returns. A log stays readable.
          - No new flag. The 0.9.0 surface is frozen by RATA-91.
          - `--json` keeps one parseable document on stdout; progress stays on stderr.

          ### Result contract

          One result per attempted item, in manifest order, on stdout. Fields:

          - `key` when the item carries a write key.
          - `id`, the Linear UUID. A failed create has no identifier, so this is the
            only handle.
          - `identifier` when Linear has assigned one.
          - `status`: `created`, `updated`, `skipped` or `failed`. Import and create use
            `created`; apply may use `updated`.
          - `error`: the classified object `{ code, message, hint }` when failed.

          The run adds one `summary`: `{ created, updated, skipped, failed, attempted,
          total }`. `attempted` is the number of results; `remaining` is `total` minus
          `attempted`.

          `--json` prints one document:

          ```json
          {
            "dryRun": false,
            "results": [
              { "key": "map", "id": "00000000-0000-4000-8000-000000000001", "identifier": "RAT-10", "status": "created" },
              { "key": "ticket-a", "id": "00000000-0000-4000-8000-000000000002", "identifier": "RAT-11", "status": "skipped" },
              { "key": "ticket-b", "id": "00000000-0000-4000-8000-000000000003", "status": "failed", "error": { "code": "validation", "message": "The state does not exist.", "hint": null } }
            ],
            "summary": { "created": 1, "updated": 0, "skipped": 1, "failed": 1, "attempted": 3, "total": 3 }
          }
          ```

          `--dry-run` returns the same document with `dryRun: true`, the planned statuses,
          and no write. Exit 0 when no item failed. Exit 1 when any item failed or the run
          stopped early. The human output prints one line per item in the existing bulk
          style, then the summary.

          ### Vocabulary

          These terms enter `GLOSSARY.md` with the 0.9.0 spec:

          - **Batch run**: one `import` or `apply` invocation. One process, sequential
            requests.
          - **Chunk**: at most 50 items. The unit of a batch mutation and of one progress
            line. It is not the unit of the result: the result is per item.
          - **State file**: the caller-owned JSONL audit of a batch run. Rata writes it
            and never reads it.

          An ADR is warranted for the sequential run and the write-only state file. It
          lands with the 0.9.0 spec, not as a separate PR.

          ### Inherited by

          - RATA-101 owns the phase order, the import and export fields, and the work
            count. It uses this report and this state file.
          - RATA-102 owns per-entry convergence. It does not batch updates in 0.9.0.
          - RATA-104 owns JSONL, `--format` and the error fields. This contract adds
            `retryAfterSeconds` and `summary`; the per-item fields stay.
          - RATA-108 measures the path and may reopen the concurrency default and the
            same-batch parent rule with numbers.
          - RATA-99, RATA-103, RATA-105, RATA-106 and RATA-107 are unaffected.
