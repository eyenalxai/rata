  - key: RATA-101
    id: 4b4509e2-0809-4ca3-8fe9-579f6ad672d3
    title: "Decide the import and export semantics"
    description: |-
      ## Question

      What are the import and export semantics?

      The biggest win the harbagsa run named. The manifest shape comes from the
      prototype ticket; this ticket decides what the commands do with it.

      Decide:

      * Is `rata export --team <key>` the exact inverse of `rata import <file>`, so
        export, edit and import round-trips with no loss?
      * What order does import apply: parents, then children, then relations, then
        comments? How does the run prove the order held?
      * What does `--state <file>` hold: done keys, failed keys with their errors,
        cursors, or all three? Is a half-written state file safe to resume?
      * What is provenance when the API refuses `createdAt` or an author: skip the
        field, write a footer block, or fail? The research ticket names which fields
        are refused.
      * Does import refuse a manifest whose team differs from the linked team, rewrite
        the team, or accept `--team`?
      * Does export include closed issues, trashed issues and comments by default, and
        which flags turn them on?
      * Which flags exist: `--dry-run`, `--apply`, `--state`, `--team`,
        `--include-closed`, `--limit`?
      * Does import report one result per item on stdout, as the bulk write contract
        requires?
      * Does the rehearsal task's evidence change any of the above?
