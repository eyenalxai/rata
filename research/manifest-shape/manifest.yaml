  - key: RATA-91
    id: e3bc825e-7a3a-4186-b6ac-5466023aa49e
    title: "Decide the 0.9.0 command surface and vocabulary"
    description: |-
      ## Question

      What command surface does 0.9.0 expose, and what vocabulary names it?

      The 0.8.0 surface is verb-oriented: `issue create`, `issue update`,
      `issue section append`, `issue comment create`, `next`, `why`. The harbagsa
      feedback asks for resource-oriented commands (`issue get`, `issue patch`,
      `issue apply`, `issue graph`) next to bulk commands (`import`, `export`,
      `apply`, `upsert`). Both cannot be the primary surface.

      The `GLOSSARY.md` verbs are fixed: delete means trash, a bulk write reports
      `updated`, `skipped` or `failed` per child, and a ticket carries blocking edges.

      Decide:

      * Does 0.9.0 keep the verb surface and add bulk commands as peers (`rata import`,
        `rata export`, `rata apply`), or move issues to `get` and `patch`?
      * Is `issue apply <ref> -f` (one issue from a file) the same command as
        `rata apply -f` (a manifest), or two commands?
      * Do `issue delete`, `issue restore` and `issue trash list` keep the `issue`
        noun, as `project delete` and `project restore` do?
      * Where does `--id-only` live: a global output flag, a read command flag, or a
        `--fields` shorthand?
      * Does 0.9.0 add `--format json|jsonl`, or keep `--json --fields` as the only
        machine surface?
      * Does a new bulk command read the repository config for its team, as the read
        commands do?

      Deliverable in the resolution comment: one command table for 0.9.0, plus one
      line per renamed or new command, with the flag that decides it. Every other
      ticket uses these names, so this one lands first.
    state: Done
    priority: urgent
    labels: ["wayfinder:grilling"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:02.696Z"
    comments:
      - key: resolution
        id: d8b0e863-ebf3-4f77-b50b-83c83e5b138a
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T16:10:10.409Z"
        body: |-
          ## Resolution

          The owner approved all seven recommendations on 2026-10-29. This comment is the
          0.9.0 command surface. Every other ticket uses these names.

          ### Surface rule

          0.9.0 keeps the verb surface. `issue create`, `issue update` and `issue show`
          stay. Bulk operations are top-level peers: `rata import`, `rata export` and
          `rata apply`. There is no move to `get` and `patch`, and no new alias: one
          operation has one name. `issue view` stays the only alias, as shipped in 0.8.0.

          `--json --fields` stays the only structured read format. `--id-only` is plain
          text, not a format switch. 0.9.0 adds no `--format json|jsonl`.

          ### Command table

          | Command | Status | Deciding flag or behaviour |
          | -- | -- | -- |
          | `status`, `link`, `unlink`, `whoami` | kept | — |
          | `config show\|set\|unset` | kept | — |
          | `workspace list\|use` | kept | — |
          | `auth login\|status\|logout` | kept | — |
          | `search <text>` | kept | gains `--id-only` |
          | `next --parent <ref>` | kept | gains `--id-only`, `--with-prs` |
          | `why <ref>` | kept | — |
          | `issue show <ref>` (`view`) | kept | gains `--with-prs` |
          | `issue list` | kept | gains `--trashed`, `--id-only`; `--include` reserved for RATA-103 |
          | `issue create` | kept | gains `--key` |
          | `issue update <ref>` | kept | — |
          | `issue delete <ref>` | new | trashes by default; `--permanently` skips the grace period and needs an admin |
          | `issue restore <ref>` | new | restores from the trash by identifier or UUID |
          | `issue comment create\|update\|delete` | kept | — |
          | `issue section get\|append\|replace` | kept | — |
          | `issue label add\|remove` | kept | — |
          | `issue assign\|unassign` | kept | — |
          | `issue link\|unlink` | kept | — |
          | `issue close\|reopen` | kept | — |
          | `team list\|show\|create\|delete` | kept | — |
          | `project list\|create\|delete\|restore` | kept | — |
          | `label list\|create\|edit` | kept | — |
          | `rata import -f <file>` | new | `-f/--file` names the source; `--team` beats the file's team, which beats the repository config |
          | `rata export` | new | `-o/--output` names the destination; `--parent`, `--project` and `--team` scope the set |
          | `rata apply -f <manifest>` | new | `-f/--file` names the manifest; `--dry-run` prints the plan |
          | `pr status <ref>` | reserved | the PR projection; RATA-105 decides the final shape |

          `--dry-run` stays available on every write, including the three bulk commands.
          Every new bulk command resolves its team and project like a read: an explicit
          flag, then the file, then the repository config.

          ### New and renamed commands

          - **New `rata import -f <file>`**: reads an external file and creates issues.
            One direction, no convergence. `--team` overrides the file.
          - **New `rata export -o <file>`**: writes Linear issues in the manifest shape.
            Scoped by `--parent`, `--project` or `--team`; the repository config supplies
            the default scope.
          - **New `rata apply -f <manifest>`**: converges Linear to a manifest. One
            declarative entry; a one-issue file is a one-entry manifest. There is no
            `issue apply`. `issue update` stays the imperative one-issue write.
          - **New `issue delete <ref>`**: moves an issue to the trash. This matches
            `project delete` and `team delete` (ADR-0004). `--permanently` is admin only.
          - **New `issue restore <ref>`**: brings a trashed issue back. It uses
            `issueUnarchive`, with `issueUpdate(trashed: null)` as the documented fallback.
          - **New `issue list --trashed`**: lists the trash. There is no `issue trash`
            group. `IssueFilter` has no `trashed` field, so the command sends
            `includeArchived: true` and filters `trashed` on the client.
          - **New `--id-only` on `issue list`, `search` and `next`**: one identifier per
            line, valid without `--json`. `next` prints nothing and exits 0 at an empty
            frontier.
          - **New `issue create --key`**: a stable key derives the issue UUID, so a retry
            returns the existing issue with `skipped`. There is no `upsert` command.
          - **New `--with-prs` on `issue show` and `next`**: projects
            `Attachment.metadata` for `sourceType: "github"`. Zero extra requests.
          - **Reserved `--include` on `issue show` and `issue list`**: the graph-aware
            read. RATA-103 decides its paths and depth.
          - **Renamed**: none.

          ### Vocabulary

          These terms enter `GLOSSARY.md` with the 0.9.0 spec.

          - **Manifest**: the authored file that declares issues, their relations and
            their comments. It is the source of truth for `apply`.
          - **Apply**: converge Linear to a manifest. It reports `created`, `updated`,
            `skipped` or `failed` per entry.
          - **Import**: read an external file and create issues. It does not converge.
          - **Export**: write Linear issues to a file in the manifest shape.
          - **Write key**: the client-chosen stable string that identifies one issue
            across retries. `--key` on `issue create` and `key` on a manifest entry use
            it. The same key on the same team returns the existing issue as `skipped`.

          `upsert` is not a term and not a command. A create with a write key is the
          upsert.

          ### What each ticket inherits

          - RATA-96 owns the key derivation, the id format and the `skipped` result.
          - RATA-97 owns the batch size (at most 50), progress and partial failure.
          - RATA-98 owns `--permanently` and the `--trashed` filter.
          - RATA-99, RATA-101, RATA-102, RATA-103, RATA-104, RATA-105, RATA-106 and
            RATA-107 use these names and add no competing ones.
    blocks: [RATA-96, RATA-97, RATA-98, RATA-99, RATA-103, RATA-104, RATA-106]

  - key: RATA-92
    id: 292c95e8-9b8a-4e3a-b68a-199b29388089
    title: "Establish Linear's batch-write and rate-limit facts"
    description: |-
      ## Question

      What are Linear's real batch-write and rate-limit facts for a 300+ issue
      migration?

      Rata spends one process per issue today. The harbagsa migration made 304
      creates, 194 comments and 80 links in 578 subprocesses over 25 minutes. Charting
      found these facts in the schema. Confirm them against the backend and close the
      gaps.

      Facts to confirm or correct:

      * `issueBatchCreate(input: { issues: [IssueCreateInput!]! })` "creates a list of
        issues atomically".
      * `issueBatchUpdate(ids: [UUID!]!, input: IssueUpdateInput!)` says "Can't be
        more than 50 at a time".
      * `IssueCreateInput.id: String` lets the client choose the issue id.
      * `rateLimitStatus: RateLimitPayload` returns `limits[]` with `type`,
        `allowedAmount`, `remainingAmount`, `requestedAmount`, `period` and `reset`.

      Answer:

      * What is the real maximum list size for `issueBatchCreate`? Is it a documented
        bound, a payload size bound, or none?
      * Can a child in one batch name a parent created in the same batch
        (`parentId`), or must the parent exist first?
      * What happens on a duplicate `IssueCreateInput.id`: an error, a silent no-op,
        or the existing issue?
      * Is `issueBatchCreate` all-or-nothing, or does it return partial success? What
        does a failure report?
      * Is 50 a hard bound for `issueBatchUpdate`?
      * Which rate-limit types apply to mutations? What is the request budget per
        hour and the complexity budget per hour?
      * What does a 429 carry: `Retry-After`, a GraphQL error extension, or both?
        RATA-77 records that `rate_limited` drops the parsed retry time.
      * Does one big batch cost less than many small ones on the complexity budget, or
        the same?

      Read the schema and SDK in `~/Projects/other/linear`. Leave the findings on a
      `research/batch-writes` branch with a context pointer comment here. Open no PR.
