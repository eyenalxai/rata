  - key: RATA-98
    id: b10cfcd5-a54f-46d5-85b0-4c83b4d9eaf4
    title: "Decide the delete, restore and trash surface"
    description: |-
      ## Question

      What is the delete, restore and trash surface?

      The destination names `issue delete`, `issue restore`, `issue trash list` and a
      `trashed` field on reads. `GLOSSARY.md` says delete means moving an object to the
      trash, and `project delete` plus `project restore` already follow that.

      Decide:

      * Is it `issue delete` plus `issue restore`, or `issue trash` plus
        `issue untrash`?
      * Is `issue trash list` a list command of its own, or `issue list --trashed`?
        Exactly one is canonical; the other may not exist.
      * Does `issue show` and `issue list` always carry `trashed`, or only with
        `--include-trashed`? Does `trashed` follow `project list`'s ` (deleted)`
        marker?
      * What guard does `issue delete` carry: `--yes` in JSON mode as
        `issue comment delete` does, a confirmation in human mode, both?
      * What happens to open children when a parent is deleted: refuse, delete the
        tree, or delete the parent only? Is there a `--children` policy?
      * Is `--permanent` in scope, given it is admin only and skips the grace period?
      * Does `issue restore` take an identifier, a URL, or only the id from a trash
        list?
      * Does `project delete` and `issue delete` share flags and output shape, or stay
        different?
    state: Done
    priority: medium
    labels: ["wayfinder:grilling"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:30.149Z"
    comments:
      - key: resolution
        id: 4c4f88a1-b691-41ad-a61a-a5a8f578dfe3
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T17:22:00.337Z"
        body: |-
          ## Resolution

          The owner approved all eight recommendations on 2026-10-29. This comment is the
          delete, restore and trash contract for 0.10.0. RATA-91 fixed the names; this
          ticket fixes the behaviour. The map retargeted to 0.10.0 on 2026-10-29, because
          RATA-109 takes 0.9.0; the contract content does not change.

          ### Inherited from RATA-91

          - `issue delete <ref>` trashes an issue. `--permanently` skips the 30-day grace
            period and is admin only.
          - `issue restore <ref>` brings a trashed issue back through `issueUnarchive`,
            with `issueUpdate(trashed: null)` as the documented fallback.
          - `issue list --trashed` is the trash view. There is no `issue trash` group and
            no `untrash` verb.
          - The names match `project delete` and `project restore` (ADR-0004). No name
            changes in this ticket.

          ### Facts this contract rests on

          - Trash is a flag on an archived issue. `Issue.trashed` is nullable; a live
            issue returns `null`, not `false`.
          - `issueDelete` trashes the issue and its sub-issues. There is no parent-only
            delete.
          - `issueUnarchive` restores one issue. Subtree restore is unverified.
          - `IssueFilter` has no `trashed` field. `includeArchived: true` returns archived
            and trashed issues together.
          - `Issue.trashed` is selectable on `issue`, `issues` and `searchIssues`.
          - `Viewer.admin` exists, so an admin check costs no extra request.

          ### The trash view

          `issue list --trashed` widens the query with `includeArchived: true` and keeps
          only `trashed === true` on the client. Every existing filter still applies:
          `--team`, `--parent`, `--text`, `--state`, `--assignee`, `--label`. The
          repository team is the default scope, as for every list.

          - A page can hold fewer rows than `--limit`, because the filter runs after the
            page. `pageInfo.hasNextPage` and `pageInfo.endCursor` stay the paging
            contract, and `--all` drains every page.
          - 0.10.0 adds no `issue list --include-archived`. rata has no `issue archive`
            command, so archived-without-trash issues stay out of every view.
          - Cost: one request per 50-row page.

          ### `trashed` on reads

          `trashed` joins the issue summary and the issue detail. It is always selected
          and decoded `null → false`, as `project.trashed` already is.

          - `issue show`, `issue summary` and every `issue list` row carry the field.
          - Human `issue show` prints `trashed: true` only when the issue is trashed.
          - The trash view adds no `(deleted)` marker: every row in it is trash.
          - `issue show` keeps reading a trashed issue by identifier, UUID or URL.

          ### `issue delete`

          ```
          rata issue delete <ref> [--cascade] [--permanently] [--yes] [--dry-run]
          ```

          - Human mode prompts, default no. JSON mode requires `--yes` and fails with code
            `validation` when it is missing, as `issue comment delete` does.
          - `--dry-run` plans without writing.
          - Before the mutation, rata reads the direct children with
            `children(includeArchived: true)`. If any child is open, it refuses with code
            `conflict`, names the open children, and points at `--cascade`. Trashed and
            completed children do not block. `--cascade` proceeds, and Linear trashes the
            tree.
          - `--dry-run` prints the tree it would trash.
          - `--permanently` requires `--yes` in both modes, states that the action cannot
            be undone, and pre-checks `Viewer.admin`. A non-admin fails with code
            `forbidden` before the mutation.
          - Cost: one resolve, one paged children read, one mutation. `--dry-run` skips
            the mutation.
          - Human text: `Moved RATA-42 and 3 sub-issues to the trash. Linear keeps them
            recoverable for 30 days.` A permanent delete says `Permanently deleted
            RATA-42 and 3 sub-issues. This cannot be undone.`

          ### `issue restore`

          ```
          rata issue restore <ref> [--dry-run]
          ```

          - Accepts an identifier, a UUID, or a linear.app URL, resolved to the UUID first
            like every write.
          - A live issue reports `skipped` and exits 0.
          - Restore does not prompt, as `project restore` does not prompt today. It takes
            `--dry-run` and shares the delete JSON shape.
          - Restores the target issue only. After the write, one
            `children(includeArchived: true)` read collects the children that stay in the
            trash, and the JSON reports them.
          - Cost: one resolve, one mutation, one paged children read. `--dry-run` skips
            the mutation.
          - Human text: `Restored RATA-42. 3 sub-issues stay in the trash; run \`rata
            issue list --trashed --parent RATA-42\`.`

          ### Wrong-state writes

          - Delete of a trashed issue: `skipped`, exit 0.
          - Restore of a live issue: `skipped`, exit 0.
          - Every 0.8.0 write already reports `skipped` on a no-op, and a retried batch
            must not stop. This reverses ADR-0004's conflict rule for projects, so the
            same spec aligns `project delete` and `project restore` to `skipped` and
            records ADR-0009.

          ### JSON shapes

          `issue delete`:

          ```json
          {
            "dryRun": false,
            "status": "updated",
            "permanent": false,
            "issue": { "id": "…", "identifier": "RATA-42", "trashed": true },
            "children": { "total": 3, "open": 0, "trashed": 3 }
          }
          ```

          `issue restore`:

          ```json
          {
            "dryRun": false,
            "status": "updated",
            "issue": { "id": "…", "identifier": "RATA-42", "trashed": false },
            "children": { "total": 3, "stillTrashed": 3 }
          }
          ```

          - `status` is `updated` or `skipped` on both commands.
          - `children` always carries `total`; the other two counters report the phase.
            A dry run counts `open` and reports `trashed: 0` for delete; a restore reports
            `stillTrashed` after the write.
          - `project delete` and `project restore` converge to `{ dryRun, status, project }`
            with the same `status` values. Project delete gains `--dry-run`; project JSON
            stops using `{ deleted }` and `{ restored }`.
          - Failure codes: `not_found` for an unknown ref, `validation` for a missing
            `--yes` in JSON mode, `conflict` for an open-child tree without `--cascade`,
            `forbidden` for `--permanently` without an admin.

          ### What the 0.10.0 spec inherits

          - One ticket adds the issue trash surface: `trashed` on reads,
            `issue list --trashed`, `issue delete`, `issue restore`.
          - One ticket aligns `project delete` and `project restore` to the shared guard
            flags, the `skipped` rule and the JSON shape.
          - `README.md` and `skills/rata/reference.md` document both commands.
            `docs/agents/issue-tracker.md` lists the trash view next to the other list
            commands.
          - `GLOSSARY.md` gains **Permanent delete**: a delete that skips the 30-day grace
            period and cannot be undone; admin only. Delete, Restore, Trash and Archive
            keep their current text.
          - ADR-0009 records the idempotent wrong-state rule and the cascade refusal.

          ### Out of scope

          - Bulk delete by parent.
          - Subtree restore through `issueBatchUpdate(trashed: null)`; RATA-108 can
            measure whether it is needed.
          - `issue archive` without trash.
          - Restoring the comments or attachments of a trashed issue.
