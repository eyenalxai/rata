  - key: RATA-99
    id: f0ad4db6-438a-4589-a6e2-6f537492c7a3
    title: "Decide how rata resolves and addresses label scope"
    description: |-
      ## Question

      How does rata resolve and address label scope?

      A manifest carries labels. A label name is ambiguous when a team label and a
      workspace label share it. `label list` shows team labels only, `label create`
      makes a team label, and `issue label add` resolves a name against team labels and
      workspace labels with no report of the match.

      Decide:

      * Is the surface `label list --scope team|workspace|all`, a separate
        `label workspace list`, or both?
      * Does `issue label add` accept `team:bug` and `workspace:Bug` prefixes, a
        `--scope` flag, or neither?
      * What is the default when a name matches both scopes, and what error does the
        caller get when a name matches neither?
      * Does `label create --scope workspace` exist? `IssueLabelCreateInput.teamId`
        says "if not given, the label will be associated with the entire workspace",
        so the API allows it; `label create` always sends the team today.
      * What does `--if-not-exists` report: the label only, or the label and the scope
        it matched?
      * Does the manifest author labels by scope, or by name with a scope hint on the
        side?
      * Do the issue defaults (`config set --label`) accept a scoped label?
    state: Done
    priority: medium
    labels: ["wayfinder:grilling"]
    assignee: "mail@iyxeyl.me"
    parent: RATA-83
    project: null
    author: "mail@iyxeyl.me"
    createdAt: "2026-10-29T15:15:31.563Z"
    comments:
      - key: resolution
        id: 344c3a8a-a501-4d97-9d4e-99c9b37b8eb5
        author: "mail@iyxeyl.me"
        createdAt: "2026-10-29T17:33:43.603Z"
        body: |-
          ## Resolution

          The owner approved all eleven recommendations on 2026-10-29. This comment is
          the label-scope contract for 0.10.x. It uses RATA-91's names and adds none.

          ### The invariant that decides the ticket

          Linear enforces label-name uniqueness across the workspace's whole label space:

          - A team label cannot share a name with a workspace label, in either direction.
          - A workspace label cannot share a name with any team's label.
          - Two teams may each own the same name.
          - The check ignores case.
          - A rename applies the same rule.
          - A delete frees the name immediately.

          Inside one team's scope (team ∪ workspace) a name therefore matches at most one
          label. Ambiguity is a state Linear refuses to create, so a label reference never
          needs a scope.

          Evidence, probed on 2026-10-29 against the live workspace. Every probe label was
          deleted afterwards, and none is left.

          | Probe | Result |
          | -- | -- |
          | `issueLabelCreate { name: "Bug", teamId: <ACME> }` | rejected: `Label "Bug" already exists in the workspace.` |
          | `issueLabelCreate { name: "wayfinder:prototype" }` while five teams own it | rejected |
          | `issueLabelCreate { name: "wayfinder:prototype", teamId: <ACME> }` | created |
          | `issueLabelUpdate` renaming a team label to `Bug` | rejected with the same error |
          | `issueLabelDelete`, then a create with the same name | created |
          | `issueLabels(filter: { team: { null: true } })` | the 3 workspace labels: `Bug`, `Improvement`, `Feature` |
          | `issueLabels(filter: { name: { eqIgnoreCase: "bug" }, or: [{ team: { id: { eq: $team } } }, { team: { null: true } }] })` | one request, one hit |
          | Label count | 65 in the workspace, 12 in RATA, 15 usable by RATA |
          | List and lookup cost | one request per scoped list, one per single-name lookup |

          ### The contract

          **D1. No scope in a reference.** A label reference is a name or a UUID, as
          `GLOSSARY.md` defines it. Scope appears only where rata lists a label or creates
          one. There is no "matches both scopes" default and no ambiguity error, because
          the state cannot exist.

          **D2. `label list` gains `--scope team|workspace|all`.** Default `all`, which
          means team ∪ workspace: every label the linked team can use, which is the
          resolution scope. `all` never means every team's labels. There is no
          `label workspace` group. Human output is name, id, color, scope. `--json` gains
          `scope` per label. `--team` still chooses the team and does nothing under
          `--scope workspace`.

          **D3. Resolution never widens.** `issue label add|remove`, `label edit`,
          `config set --label`, import and apply resolve against exactly one team plus the
          workspace: the flag team, then the linked team. They never search another team's
          labels. A UUID is used as-is with no scope check; Linear rejects a foreign label
          on write and rata surfaces that error.

          **D4. No scope syntax on `issue label add|remove`.** No `team:` or `workspace:`
          prefix and no `--scope` flag. `:` already occurs in real label names
          (`wayfinder:map`), so a prefix collides with the names it would address.

          **D5. The miss error.** A name that matches nothing reports both scopes it
          searched and hints `rata label list --scope all`. rata then runs one
          `name: { eqIgnoreCase }` request with no team filter. When that single hit lives
          in another team, the message names that team, says the label is not usable here,
          and says to create it for this team first. Cost: one request, miss path only.

          **D6. `label create --scope team|workspace`.** Default `team`. `--team` with
          `--scope workspace` is a usage error. A workspace label needs an admin key; the
          API accepted it for this admin viewer, and a non-admin key is expected to be
          refused by Linear, which rata surfaces as-is. The non-admin path is unverified:
          there is no non-admin key in this workspace.

          **D7. `--if-not-exists` reports the scope it matched.** JSON is
          `{ label: { id, name, color, scope }, created }`. A workspace label that holds
          the name is still a hit and returns `created: false`: every team can use it, so
          the caller converged. A name held by another team is never a hit.

          **D8. One label shape.** `scope: "team" | "workspace"` joins the shared label
          object in `label list`, `label create|edit --json`, `issue show`, `issue list`,
          `next` and every write result, as `team show` already does. No team field rides
          along: the scope value carries the fact. RATA-104 fixes the final serialization.

          **D9. Manifest authoring.** Issue entries carry labels as plain names. A
          top-level `labels: [{ name, scope, color? }]` list declares the labels that
          import may create, and export writes that list from the labels it referenced.
          Scope lives in the declaration, never in the entry. RATA-100 fixes the file
          shape; RATA-101 fixes the create-on-miss rule.

          **D10. Issue defaults.** `config set --label` takes a name or a UUID, with no
          scope syntax. `issue create` resolves each default against the issue's team plus
          the workspace and fails with the D5 error. `config show --json` keeps plain
          names. A workspace label works from every linked repository.

          **D11. `label edit` stays as shipped.** No `--scope` flag, because the name is
          unique and a UUID is accepted. No scope move between team and workspace, even
          though `IssueLabelUpdateInput.teamId` allows it: it is a destructive-feeling
          write with no workflow behind it.

          ### What each ticket inherits

          - **RATA-100** owns the manifest file shape. It carries D9: plain names in
            entries, scope in the top-level `labels` declarations.
          - **RATA-101** owns create-on-miss. It decides whether import creates a missing
            label, and in which scope, using D6 and D9.
          - **RATA-104** owns the error taxonomy and the final serialization. It takes D5,
            D7 and D8 as inputs.
          - **RATA-103, RATA-105, RATA-106, RATA-107** are untouched.

          ### Glossary delta

          These sentences land with the 0.10.0 spec:

          - **Label**: add "A label name is unique across the workspace: a team label and
            a workspace label cannot share it, and two teams may. Inside one team's scope
            a name therefore identifies one label."
          - **Label reference**: add "The name resolves against the linked team and the
            workspace, and a scope prefix is not part of the reference."

          ### Code impact for the 0.10.0 spec

          - `label list`: default the filter to team ∪ workspace, add `--scope`, add the
            scope column and the `scope` field.
          - `label create`: add `--scope`, keep `teamId` out of the input under
            `--scope workspace`, report the matched scope from `--if-not-exists`, and
            reject `--team` with `--scope workspace`.
          - `label.ts`: one shared label schema with `scope`.
          - Label resolution: keep the team ∪ workspace query; add the cross-team lookup
            to the miss path.
          - `label edit`, `config`, the manifest and the issue writes keep their current
            flags. The only change is the scope field they report.

          ### What this ticket did not decide

          - The error code taxonomy: RATA-104.
          - Whether import creates a missing label: RATA-101.
          - The manifest file shape: RATA-100.
          - A `label delete` or `label retire` command: out of scope for 0.10.0.
    blocks: [RATA-100]

  - key: RATA-100
    id: 94138212-ce19-4e75-92a1-6702c58e9ccc
    title: "Prototype the canonical rata manifest for one team"
    description: |-
      ## Question

      What does a canonical rata manifest look like for one real team?

      Build a throwaway prototype and hand it to the owner. Do not guess the shape in
      prose; show a file.

      * Take the RATA team, or a 30-issue slice of it, and write the candidate manifest
        by hand from the API.
      * Cover the containers: one JSON document, one YAML document, or a directory of
        files.
      * Cover an issue entry: key, title, description, state, priority, labels,
        assignee, parent, project, `createdAt`.
      * Cover comments: body, `createdAt`, key, order.
      * Cover relations: `blocks` edges by key, written once and read in both
        directions.
      * Cover provenance: an author field, a `createdAt` field, and what rata writes
        when Linear refuses the value.
      * Cover resolution: labels by scope, states by name, assignees by email or id.
      * Measure the size: what a 300-issue, 200-comment, 80-link manifest weighs.

      Put the prototype on a `research/manifest-shape` branch, link it from this
      ticket, and open no PR. The owner reviews the file, not a description of it.
