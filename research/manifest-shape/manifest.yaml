          ## Finding

          Linear already carries the pull request, its state and its review state on the issue as an `Attachment`. `Attachment.metadata: JSONObject!` holds `status` (`open`/`merged`), `draft`, `linkKind`, `reviews`, `reviewerDetails`, `number`, `repoLogin`, `repoName`, `hasConflicts`, `mergedAt` and `closedAt`. rata fetches attachments today and selects only six fields (`src/api/issue-query.ts:33`), so `--with-prs` is a zero-request projection, not a new integration.

