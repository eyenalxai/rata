  - key: RATA-83
    id: 90b3d128-34a9-4ee9-abc1-aad766e95176
    title: "Agent-native tracker follow-ups for rata 0.10.0"
    description: |-
      ## Destination

      A 0.10.0 contract and spec that close the remaining jyoti and harbagsa feedback:
      bulk import and export, issue delete, restore and trash, idempotent upserts,
      declarative apply, graph-aware reads, machine-first scripting, PR awareness, and
      a cache and audit log.

      The map is done when every decision below is resolved, so `/to-spec` can write the
      0.10.0 spec without a guess.

      ## Notes

      Sources: the jyoti mission feedback behind RATA-77, and the harbagsa migration
      feedback: 304 creates, 194 comments, 80 links, 578 subprocesses and 25 minutes.
      Import/export and delete/restore are the two biggest wins. `--key` plus upsert,
      `--dry-run` everywhere with a label resolution report, and graph-aware
      `issue list --include` with `--id-only` are the next three.

      0.8.0 shipped at `3d24065`: PR #22, tag `v0.8.0`, Arch package `0.8.0-1`. This
      map is charted from that commit. There is no backwards compatibility with 0.7.0
      or 0.8.0.

      ### Facts from charting

      Read from `~/Projects/other/linear/packages/sdk/src/schema.graphql`. The research
      tickets confirm them and close the gaps.

      * `IssueCreateInput.id: String` lets the client choose an issue id. A deterministic
        id makes a create retry-safe and lets one batch wire parents, children and
        blockers without a read.
      * `issueBatchCreate` "creates a list of issues atomically". `issueBatchUpdate`
        takes "no more than 50" ids.
      * `IssueCreateInput.createdAt`, `IssueCreateInput.completedAt` and
        `CommentCreateInput.createdAt` accept a past time. `createAsUser` and
        `displayIconUrl` need an OAuth application in `actor=app` mode, so an API key
        cannot keep a comment author.
      * `issueDelete`, `issueArchive(trash)`, `issueUnarchive` and `Issue.trashed`
        exist. `permanentlyDelete` is admin only and skips the 30-day grace period.
      * `rateLimitStatus { limits { type allowedAmount remainingAmount period reset } }`
        exists. RATA-77 records that `rate_limited` drops the parsed retry time today.
      * Linear runs its own import jobs: `issueImportCreateCSVJira` takes a `csvUrl`,
        with `issueImportCheckCSV`, `issueImportUpdate` and `issueImportDelete`.

      ### Standing rules

      * Use `rata` for every tracker operation.
      * Keep the map and its children unassigned until the claim step. The assignee is
        the claim.
      * One decision ticket per session. Research tickets may run in parallel, and only
        after the owner approves this map.
      * Read `GLOSSARY.md`, `docs/adr/`, `docs/agents/issue-tracker.md` and `AGENTS.md`
        before a ticket. Read `node_modules/effect/AGENTS.md` before any Effect-shaped
        design.
      * Measure cost where the ticket asks for it. A decision that changes the API call
        count needs the number.

      ## Decisions so far

      <!-- one line per closed ticket: the gist, then the link for the detail -->

      * PR awareness: Linear's `Attachment.metadata` already holds PR state, draft, review state and timestamps; rata selects only six attachment fields today, so `--with-prs` costs zero extra requests and needs no GitHub auth. See [research/pr-awareness.md](<https://github.com/eyenalxai/rata/blob/research/pr-awareness/research/pr-awareness.md>).
      * Batch writes: `issueBatchCreate` is capped at 50 and atomic; batching turns 304 creates into 7 requests, but comments and links have no batch mutation. Budgets are 2,500 requests and 3,000,000 complexity points per hour, and a 429 carries both `Retry-After` and a `RATELIMITED` extension. See [research/batch-writes.md](<https://github.com/eyenalxai/rata/blob/research/batch-writes/research/batch-writes.md>).
      * Migration provenance: `createdAt`/`completedAt` work on a plain API key but only on create; a comment author cannot be kept without an OAuth `actor=app` app, so use a bold prefix line. The CSV import job is Jira-only, cannot be finished headless, and needs a fresh team to keep identifiers. Manifest + batch writes stays the main path. See [research/migration-provenance.md](<https://github.com/eyenalxai/rata/blob/research/migration-provenance/research/migration-provenance.md>).
      * Trash and restore: trash is a flag on an archived issue; `issueDelete` trashes with a documented 30-day grace, and `permanentlyDelete` is admin only. `issueUnarchive` restores, and `issueUpdate` with `trashed: null` is the documented fallback. `IssueFilter` has no trashed field, so `issue list --trashed` is `includeArchived: true` plus a client-side filter. See [research/issue-trash.md](<https://github.com/eyenalxai/rata/blob/research/issue-trash/research/issue-trash.md>).
      * Command surface: the verbs stay, and `import`, `export` and `apply` join as top-level peers. `issue delete`, `issue restore`, `issue list --trashed`, `issue create --key`, `--id-only` on list-shaped reads, and `--with-prs` on `issue show` and `next`. No `--format`, no `get`/`patch`, no `upsert` command. See [the command table](<https://linear.app/utbetdix/issue/RATA-91/decide-the-090-command-surface-and-vocabulary#comment-d8b0e863-ebf3-4f77-b50b-83c83e5b138a>).
      * Identity: `issue create --key` derives a UUIDv4-shaped issue id from the team UUID and the key; there is no SQLite map and no footer. A hit returns `skipped`, a team mismatch returns `conflict`, and `--key` never updates. Manifest entries carry `key` to create and `id` to address. See [RATA-96](https://linear.app/utbetdix/issue/RATA-96/decide-the-identity-and-idempotency-contract#comment-06133e35-84df-41e7-9cd5-385ef3683289).
      * Batch execution: one process, sequential, 50 per `issueBatchCreate`, level order, `Retry-After` up to 60 s then a clean stop with a resumable rerun, one result per item, and `--state` is a write-only JSONL audit. See [RATA-97](https://linear.app/utbetdix/issue/RATA-97/decide-the-batch-execution-and-progress-contract#comment-a4ea1566-f0e1-4b0f-b606-e67b101ec6d0).
      * Mission front door: RATA-109 takes 0.9.0; this map retargets to 0.10.0. RATA-91's `--id-only` name is superseded by `--ids-only` in RATA-109. The front door owns the core exit codes and the Linear-only PR projection; RATA-104 and RATA-105 own the batch and graph extensions.
      * Delete, restore and trash: `issue delete` trashes and cascades to sub-issues, refuses an open-child tree unless `--cascade`, and `--permanently` is admin-only behind a `Viewer.admin` pre-check. `issue restore` restores one issue and reports the children that stay trashed. `issue list --trashed` is the only trash view, `trashed` rides on every read, and a wrong-state write is `skipped`. See [RATA-98](https://linear.app/utbetdix/issue/RATA-98/decide-the-delete-restore-and-trash-surface#comment-4c4f88a1-b691-41ad-a61a-a5a8f578dfe3).
      * Label scope: Linear refuses a team label and a workspace label with the same name, so inside team ∪ workspace a name matches one label and a reference never carries a scope; `label list --scope team|workspace|all` defaults to the usable set, every label object reports `scope`, `label create --scope workspace` is admin-gated, and a miss costs one cross-team hint lookup. See [RATA-99](https://linear.app/utbetdix/issue/RATA-99/decide-how-rata-resolves-and-addresses-label-scope#comment-344c3a8a-a501-4d97-9d4e-99c9b37b8eb5).

      ## Not yet specified

      * The 0.10.0 release shape: one release or 0.10.x patches, and what the release
        checklist gains for a migration tool. Waits on the whole map.
      * The documentation and skill surface. An import and apply workflow may replace
        the create-and-link loop that `docs/agents/issue-tracker.md` and `skills/rata`
        teach. Which documents change depends on the commands.
      * Whether a manifest becomes the authored source of truth for a spec, with Linear
        as its output. That changes the tracker workflow, not only the CLI.
      * Whether rata's own tracker is the first real manifest, or a scratch team stays
        the test bed.
      * The error taxonomy beyond `retryable`: whether a partial batch needs its own
        code, and how a bulk command reports it.
      * Windows and cross-platform path handling for an export file and a state file,
        if the release claims it.

      ## Out of scope

      * The 0.8.0 surface in RATA-77.
      * A `--format` template language. Use `--json --fields` and `jq`.
      * Backwards compatibility with 0.7.0 or 0.8.0.
      * A resident daemon, server mode, an MCP server, or scheduled sync. A batch run
        is one process per invocation.
      * Linear projects as the container for specs. This repository does not use
        projects.
      * Comment reactions, resolve and unresolve, and attachments as a surface.
      * Import from GitHub, Asana, Clubhouse or Jira's API. The Jira CSV job is a
        research question only.
      * Multi-workspace bulk writes, and an import that writes to another workspace
        profile.
      * A UI or TUI.

      ## Mission: rata 0.10.0 agent-native tracker

      Status: active
      Scope: fog
      Phase: resolve
      Gate: Decision, pending. Method: the ticket's `wayfinder:<type>`.
      Goal: a 0.10.0 contract and spec, decided from this map.
      Exit: every decision ticket resolved, `/to-spec` writes the 0.10.0 spec, and the
      spec's tickets build it.

      ### Flow

      - [X] classify: fog. Sixteen fog areas from the placeholder, one command-surface
            fork, and one rehearsal.
      - [X] chart: this map and its decision tickets (2026-10-29)
