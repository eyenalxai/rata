  - key: RATA-102
    id: 54b55f4b-2818-4962-8fdb-d2b3906dc75c
    title: "Decide the declarative apply semantics"
    description: |-
      ## Question

      What does declarative apply mean for 0.9.0?

      The feedback asks for a `mission.yaml` or `tickets.json` that reconciles parents,
      blockers, labels, states and assignments in one idempotent `rata apply -f`.

      Decide:

      * Is `apply` the same contract as `import`, or a second one? Import creates and
        skips; apply reconciles a declared state, so it can update and close.
      * What is the reconciliation order, and what does apply do with a live object the
        manifest does not name: leave it, close it, or fail?
      * What is the conflict policy when the live issue changed after the manifest was
        written: overwrite, skip, or fail with `conflict`?
      * What does `--dry-run` print: a plan per object, a unified diff per changed
        field, or both?
      * Does `apply` cover a wayfinder map and its tickets, or specs and tickets only?
        The tracker document says a map's children are claimed one at a time.
      * Does every object in the manifest need a key, or does apply derive one?
      * Does apply use the `--if-unchanged` snapshot in the manifest, or ignore it?
