    title: "Add issue status"
    description: |-
      ## Parent

      RATA-109 — Mission: mission-shaped front door for rata.

      ## What to build

      `rata issue status <ref>` is one read for the issue, its GitHub PRs, its open blockers, and its next unblocked child. Human output is a compact summary. JSON is the full object.

      The PR projection reads the `github` attachments. `checks` and `mergeCommit` are null because Linear does not carry them. Each PR says `source: "linear"`. The next child is the first open, unblocked child by priority then creation time; it does not filter on assignee.

      ## Acceptance criteria

      - [ ] Human output shows state, priority, assignee, open blockers, PR state, and the next child.
      - [ ] JSON carries the issue header, `blocked`, `blockedBy`, `prs`, and `nextChild`.
      - [ ] A merged PR, an open PR, a draft PR, and no PR all render.
      - [ ] Missing metadata gives null fields, not an error.
      - [ ] A missing issue exits 3.
      - [ ] The next child ignores the assignee, unlike `rata next`.
