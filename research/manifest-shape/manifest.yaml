  - key: RATA-104
    id: 76e0d2a1-ed9d-412c-8b32-96fc19751859
    title: "Decide the machine-first output and error contract"
    description: |-
      ## Question

      What is the machine-first output and error contract?

      The feedback asks for `RATA_JSON`, `RATA_FIELDS`, `--format json|jsonl`,
      `--id-only`, `--count`, no color when piped, a `rata states` command, stable exit
      codes with `conflict` distinct from `validation`, and a JSON error object with
      `retryable` and `details`. RATA-77 records three known gaps: 403 maps to `auth`
      instead of `forbidden`, an unknown `--fields` path now lists the valid paths, and
      `rate_limited` drops the parsed retry time.

      Decide:

      * Do `RATA_JSON` and `RATA_FIELDS` exist, or is a flag the only switch? An
        environment default is easy to set and hard to turn off.
      * Is `--format json|jsonl` in scope next to `--json`? A batch run produces one
        result per item, which is the shape JSONL fits.
      * Does JSON mode always drop color, and does human mode drop it when stdout is
        not a TTY?
      * What are the exit codes: `0`, `1`, and one code per error class, or only `0`
        and `1` with the code in the JSON?
      * Does every error gain `retryable` and `details`, and does `details` stay behind
        `RATA_DEBUG`?
